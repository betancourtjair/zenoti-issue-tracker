<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenoti Issue Tracker</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --surface-3: #e7eaef;
  --border: #d8dce3;
  --border-strong: #b9c0cb;
  --text: #18212d;
  --muted: #5b6676;
  --accent: #2c56a5;
  --accent-soft: #e5ecf8;
  --on-accent: #ffffff;
  --navy: #17365d;
  --on-navy: #ffffff;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --warn: #9a4a00;
  --warn-soft: #fff3d6;
  --ok: #08703f;
  --ok-soft: #e3f5ea;
  --p1: #c00000; --p1-ink: #ffffff;
  --p2: #ed7d31; --p2-ink: #1d1206;
  --p3: #ffd966; --p3-ink: #2a2100;
  --p4: #5b9bd5; --p4-ink: #07172a;
  --p5: #a5a5a5; --p5-ink: #161616;
  --shadow: 0 10px 30px rgba(16, 24, 40, .18);
  --radius: 10px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c26; --surface-2: #1b2430; --surface-3: #232e3c;
    --border: #2b3645; --border-strong: #3d4a5c; --text: #e5e9ef; --muted: #9ba7b7;
    --accent: #84a9ef; --accent-soft: #1d2a40; --on-accent: #0b1220;
    --navy: #10243f; --on-navy: #e8eef7;
    --danger: #ff8a80; --danger-soft: #3a1714; --warn: #f5b454; --warn-soft: #3a2a0f;
    --ok: #6fd69b; --ok-soft: #12301f;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --surface-2: #1b2430; --surface-3: #232e3c;
  --border: #2b3645; --border-strong: #3d4a5c; --text: #e5e9ef; --muted: #9ba7b7;
  --accent: #84a9ef; --accent-soft: #1d2a40; --on-accent: #0b1220;
  --navy: #10243f; --on-navy: #e8eef7;
  --danger: #ff8a80; --danger-soft: #3a1714; --warn: #f5b454; --warn-soft: #3a2a0f;
  --ok: #6fd69b; --ok-soft: #12301f;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar */
.topbar {
  background: var(--navy); color: var(--on-navy);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 20px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .1px; }
.brand .sub { font-size: 12.5px; opacity: .75; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 6px 12px; min-height: 34px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .chip-btn:focus-visible, .metric:focus-visible, tbody tr:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.topbar .btn { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.28); color: var(--on-navy); }
.topbar .btn:hover { background: rgba(255,255,255,.18); }
.topbar .btn.primary { background: #ffffff; color: #17365d; border-color: #ffffff; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.small { min-height: 28px; padding: 3px 9px; font-size: 12.5px; }
.count-pill { background: #f5b454; color: #2a1800; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 700; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 230px;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow); padding: 6px;
}
.menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu-list button:hover { background: var(--surface-2); }
.menu-list hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }

/* Banners */
#banners { padding: 0 20px; }
.banner {
  margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.banner p { margin: 0; flex: 1 1 320px; }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.banner.info { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.banner.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }

/* Tabs */
.tabs { display: flex; gap: 4px; padding: 14px 20px 0; border-bottom: 1px solid var(--border); }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer;
  color: var(--muted); font-weight: 600;
}
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
main { padding: 16px 20px 40px; max-width: 1600px; margin: 0 auto; }

/* Metrics */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.metric {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.metric:hover { border-color: var(--border-strong); }
.metric[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.metric .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.metric .l { font-size: 12.5px; color: var(--muted); }
.metric.alert .v { color: var(--danger); }
.metric.caution .v { color: var(--warn); }
.metric.dist { grid-column: span 2; cursor: default; }
.distbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-3); margin: 6px 0 6px; }
.distbar span { display: block; height: 100%; }
.distlegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
.distlegend button { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--text); }
.distlegend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
@media (max-width: 520px) { .metric.dist { grid-column: span 1; } }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.filters input[type="search"] { flex: 1 1 240px; min-width: 0; }
.filters select, .filters input, .field input, .field select, .field textarea, .inline-input {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 10px; min-height: 34px;
}
.filters select { flex: 0 1 auto; max-width: 100%; }
.result-count { margin-left: auto; color: var(--muted); font-size: 12.5px; }

/* Table */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
@media (min-width: 861px) { #view-issues .table-wrap { max-height: calc(100vh - 150px); } }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface-2); text-align: left; font-weight: 650;
  border-bottom: 1px solid var(--border); padding: 0; white-space: nowrap; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .3px;
}
thead th button { all: unset; display: block; padding: 9px 10px; cursor: pointer; }
thead th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
thead th[aria-sort] button::after { content: " ▾"; }
thead th[aria-sort="ascending"] button::after { content: " ▴"; }
tbody td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.closed td { color: var(--muted); }
td.title-cell { min-width: 260px; max-width: 420px; }
td.id-cell { white-space: nowrap; }
td.tags-cell { min-width: 190px; }
.title-cell strong { display: block; font-weight: 600; }
.title-cell .imp { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
td.right, th.right { text-align: right; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
@media (max-width: 860px) { .hide-md { display: none; } }

/* Badges & chips */
.pri { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 650; white-space: nowrap; }
.pri-Prioritary { background: var(--p1); color: var(--p1-ink); }
.pri-Urgent { background: var(--p2); color: var(--p2-ink); }
.pri-Important { background: var(--p3); color: var(--p3-ink); }
.pri-Relevant { background: var(--p4); color: var(--p4-ink); }
.pri-Preferable { background: var(--p5); color: var(--p5-ink); }
.pri-none { background: transparent; color: var(--warn); border: 1px dashed var(--warn); }
.below { display: block; margin-top: 4px; font-size: 11.5px; color: var(--warn); white-space: nowrap; }
.tag { display: inline-block; border: 1px solid var(--border-strong); border-radius: 6px; padding: 0 6px; font-size: 11.5px; margin: 0 4px 4px 0; white-space: nowrap; background: var(--surface-2); }
.clause { display: inline-block; font-family: var(--mono); font-size: 12px; margin-right: 5px; white-space: nowrap; }
.clause.auto { color: var(--accent); text-decoration: underline dotted; }
.st { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 12px; white-space: nowrap; font-weight: 600; }
.st-overdue, .st-stale { background: var(--danger-soft); color: var(--danger); }
.st-none { background: var(--warn-soft); color: var(--warn); }
.st-ok { background: var(--ok-soft); color: var(--ok); }
.st-closed { background: var(--surface-3); color: var(--muted); }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); z-index: 50;
  background: var(--bg); box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.drawer-head { padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.drawer-head h2 { margin: 0; font-size: 16px; line-height: 1.3; }
.drawer-head .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.drawer-head .x { margin-left: auto; }
.drawer-body { overflow: auto; padding: 12px 20px 20px; flex: 1; }
.drawer-foot { padding: 12px 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.drawer-foot .msg { flex: 1 1 0; min-width: 0; font-size: 12.5px; color: var(--danger); }
fieldset { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 12px 14px 14px; margin: 12px 0 0; min-width: 0; }
legend { font-weight: 700; padding: 0 6px; font-size: 13px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.wide { grid-column: 1 / -1; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 600; }
.field .req { color: var(--danger); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field textarea { min-height: 64px; resize: vertical; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.field .err { font-size: 11.5px; color: var(--danger); }
.tag-family { margin-bottom: 8px; }
.tag-family .fam { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
.chip-btn {
  border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 2px 10px; margin: 0 5px 5px 0;
  cursor: pointer; font-size: 12px;
}
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip-btn.undef { border-style: dashed; }
.companions { font-size: 12px; color: var(--muted); margin-top: 4px; }
.clause-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
@media (max-width: 600px) { .clause-grid { grid-template-columns: 1fr; } }
.clause-opt { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; }
.clause-opt:hover { background: var(--surface-2); }
.clause-opt input { margin-top: 3px; }
.clause-opt .eff { display: block; color: var(--muted); font-size: 11.5px; }
.clause-opt .autow { display: block; color: var(--accent); font-size: 11.5px; font-weight: 600; }
.verdict { margin-top: 12px; border-radius: 8px; padding: 10px 12px; background: var(--surface-2); display: grid; gap: 6px; }
.verdict .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.verdict.warn { background: var(--warn-soft); }
.log { list-style: none; margin: 10px 0 0; padding: 0; }
.log li { border-top: 1px solid var(--border); padding: 7px 0; font-size: 13px; display: flex; gap: 10px; }
.log .d { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 86px; }
.log .k { font-size: 11px; border-radius: 5px; padding: 0 6px; height: 18px; line-height: 18px; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.log .k.note { background: var(--accent-soft); color: var(--accent); }
.add-update { display: grid; grid-template-columns: 150px 1fr auto; gap: 8px; align-items: start; }
@media (max-width: 600px) { .add-update { grid-template-columns: 1fr; } }
.source { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* Reference */
.ref h2 { font-size: 15px; margin: 22px 0 8px; }
.ref h2:first-child { margin-top: 4px; }
.ref p { max-width: 900px; margin: 6px 0; }
.ref table { font-size: 12.5px; }
.ref tbody tr { cursor: default; }
.ref tbody tr:hover td { background: transparent; }
.ref td { min-width: 110px; }
.ref .table-wrap { max-height: none; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.how div { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.how h3 { margin: 0 0 4px; font-size: 13.5px; }
.how p { margin: 0; font-size: 13px; color: var(--muted); }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow);
  max-width: calc(100vw - 32px); font-size: 13px;
}
[hidden] { display: none !important; }
@media (max-width: 600px) {
  .topbar, #banners, .tabs, main { padding-left: 16px; padding-right: 16px; }
  .brand .sub { display: none; }
  .drawer-head, .drawer-body, .drawer-foot { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Zenoti Issue Tracker</h1>
    <span class="sub" id="dataStamp"></span>
  </div>
  <div class="actions">
    <button class="btn primary" id="btnNew" type="button">+ New issue</button>
    <button class="btn" id="btnSave" type="button" title="Download issues.js to commit to your repository">Save data file <span class="count-pill" id="dirtyPill" hidden></span></button>
    <details class="menu" id="moreMenu">
      <summary class="btn" role="button">More ▾</summary>
      <div class="menu-list">
        <button type="button" id="btnCsv">Export CSV (for Excel)</button>
        <button type="button" id="btnImport">Import data file…</button>
        <hr>
        <button type="button" id="btnDiscard">Discard browser changes</button>
      </div>
    </details>
    <input type="file" id="fileInput" accept=".js,.json,application/json,text/javascript" hidden>
  </div>
</header>
<div id="banners" aria-live="polite"></div>
<nav class="tabs" role="tablist" aria-label="Views">
  <button class="tab" role="tab" id="tab-issues" aria-controls="view-issues" aria-selected="true" type="button">Issues</button>
  <button class="tab" role="tab" id="tab-ref" aria-controls="view-ref" aria-selected="false" type="button">Rules &amp; tags</button>
</nav>
<main>
  <section id="view-issues" role="tabpanel" aria-labelledby="tab-issues">
    <div class="metrics" id="metrics"></div>
    <div class="filters" id="filters">
      <label class="sr-only" for="fQ">Search</label>
      <input type="search" id="fQ" placeholder="Search ID, title, impact, owner, tags…">
      <label class="sr-only" for="fStatus">Status</label>
      <select id="fStatus"></select>
      <label class="sr-only" for="fPri">Priority</label>
      <select id="fPri"></select>
      <label class="sr-only" for="fFn">Function</label>
      <select id="fFn"></select>
      <label class="sr-only" for="fTag">Tag</label>
      <select id="fTag"></select>
      <label class="sr-only" for="fFlag">Flag</label>
      <select id="fFlag"></select>
      <button class="btn small" type="button" id="btnClear">Clear filters</button>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyState" hidden>No issues match these filters.</div>
    </div>
  </section>
  <section id="view-ref" class="ref" role="tabpanel" aria-labelledby="tab-ref" hidden></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <div>
      <h2 id="drawerTitle"></h2>
      <div class="meta" id="drawerMeta"></div>
    </div>
    <button class="btn small x" type="button" id="btnClose" aria-label="Close">Close</button>
  </div>
  <form class="drawer-body" id="form" novalidate></form>
  <div class="drawer-foot">
    <button class="btn primary" type="button" id="btnSaveIssue">Save issue</button>
    <button class="btn" type="button" id="btnCancel">Cancel</button>
    <span class="msg" id="formMsg"></span>
    <button class="btn danger" type="button" id="btnDelete">Delete</button>
  </div>
</aside>
<div id="toast" role="status" hidden></div>

<script src="issues.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'zenoti-issue-tracker:v1';
  var PREF_KEY = 'zenoti-issue-tracker:prefs';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- storage (best-effort) ---------- */
  var storageOk = true;
  function readJSON(key) { try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { storageOk = false; return null; } }
  function writeJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { storageOk = false; return false; } }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseD(s) { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return parseD(todayStr()); }
  function calSince(s) { var d = parseD(s); return d ? Math.round((today() - d) / 864e5) : null; }
  function calUntil(s) { var d = parseD(s); return d ? Math.round((d - today()) / 864e5) : null; }
  function bizSince(s) {
    var d = parseD(s); if (!d) return null; var t = today(); if (d >= t) return 0;
    var n = 0, c = new Date(d); c.setDate(c.getDate() + 1);
    while (c <= t) { var w = c.getDay(); if (w !== 0 && w !== 6) n++; c.setDate(c.getDate() + 1); }
    return n;
  }
  function fmtDate(s) { var d = parseD(s); if (!d) return ''; return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
  function fmtMXN(n) { return n == null || n === '' ? '' : Number(n).toLocaleString('es-MX', { maximumFractionDigits: 0 }); }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 4200); }

  /* ---------- state ---------- */
  var seed = JSON.parse($('seed').textContent);
  var fileData = (window.ZENOTI_DATA && Array.isArray(window.ZENOTI_DATA.issues)) ? window.ZENOTI_DATA : null;
  var state = { data: null, baseStamp: '', dirty: 0, source: fileData ? 'file' : 'seed', notice: null, conflictFile: null,
    filters: { q: '', status: 'open', pri: '', fn: '', tag: '', flag: '' }, sort: { key: 'priority', dir: 1 }, view: 'issues' };

  function normalize(d) {
    d = clone(d);
    d.meta = d.meta || {};
    d.config = d.config || clone(seed.config);
    d.issues = (d.issues || []).map(function (it) {
      var b = blankIssue(); for (var k in it) b[k] = it[k];
      if (!Array.isArray(b.tags)) b.tags = String(b.tags || '').split(';').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!Array.isArray(b.clauses)) b.clauses = String(b.clauses || '').split(';').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!Array.isArray(b.log)) b.log = [];
      return b;
    });
    return d;
  }
  function blankIssue() {
    return { id: '', title: '', period: '', detectedDate: '', status: 'Open', requestType: '', function: '', tags: [], impactSummary: '',
      financialImpact: null, financialPeriod: 'per day', locations: '', membersAffected: '', workaround: '', basePriority: '', overridePriority: '',
      clauses: [], deadline: '', lastUpdate: '', lastAgentResponse: '', recommendedAction: '', reporter: '', zenotiTicket: '', zenotiOwner: '',
      nextAction: '', nextActionDue: '', cadenceNote: '', nextReview: '', closureCriteria: '', rcaRequired: '', preventionOwner: '',
      evidence: '', closureNotes: '', source: '', log: [], createdAt: todayStr(), updatedAt: todayStr() };
  }

  function load() {
    var base = normalize(fileData || seed);
    var stamp = base.meta.exportedAt || '';
    var local = readJSON(KEY);
    if (local && local.data && Array.isArray(local.data.issues)) {
      if (local.baseStamp === stamp) { useLocal(local); }
      else if (local.baseStamp > stamp) { useLocal(local); if (!local.dirty) state.notice = 'newer'; }
      else if (local.dirty) { useLocal(local); state.notice = 'conflict'; state.conflictFile = base; }
      else { useBase(base, stamp); }
    } else { useBase(base, stamp); }
    var prefs = readJSON(PREF_KEY);
    if (prefs && prefs.filters) { for (var k in prefs.filters) if (k in state.filters) state.filters[k] = prefs.filters[k]; }
    if (prefs && prefs.sort) state.sort = prefs.sort;
  }
  function useLocal(l) { state.data = normalize(l.data); state.baseStamp = l.baseStamp; state.dirty = l.dirty || 0; }
  function useBase(b, stamp) { state.data = b; state.baseStamp = stamp; state.dirty = 0; }
  function persist() { writeJSON(KEY, { data: state.data, baseStamp: state.baseStamp, dirty: state.dirty, savedAt: new Date().toISOString() }); }
  function savePrefs() { writeJSON(PREF_KEY, { filters: state.filters, sort: state.sort }); }
  function markDirty() { state.dirty++; persist(); renderChrome(); }

  /* ---------- rules ---------- */
  function cfg() { return state.data.config; }
  function priNames() { return cfg().priorities.map(function (p) { return p.name; }); }
  function rank(name) { var i = priNames().indexOf(name); return i < 0 ? null : i; }
  function priObj(name) { return cfg().priorities.filter(function (p) { return p.name === name; })[0] || null; }
  function higher(a, b) { var ra = rank(a), rb = rank(b); if (ra == null) return rb == null ? '' : b; if (rb == null) return a; return ra <= rb ? a : b; }
  function clauseById(id) { return cfg().clauses.filter(function (c) { return c.id === id; })[0] || null; }
  function isClosed(it) { return cfg().closedStatuses.indexOf(it.status) >= 0; }
  function applyClause(base, logic) {
    var r = rank(base); if (r == null || !logic) return base;
    if (logic.kind === 'set' || logic.kind === 'atLeast') return higher(base, logic.level);
    if (logic.kind === 'up') {
      var nr = Math.max(0, r - 1);
      if (logic.max) { var m = rank(logic.max); nr = Math.min(r, Math.max(nr, m)); }
      return priNames()[nr];
    }
    return base;
  }
  function autoClauses(it) {
    var out = []; if (isClosed(it)) return out;
    var n;
    if (it.lastAgentResponse) { n = bizSince(it.lastAgentResponse); if (n > 1) out.push({ id: 'E05', why: 'No agent response for ' + n + ' business days' }); }
    if (it.deadline) {
      n = calUntil(it.deadline);
      if (n <= 3) out.push({ id: 'E08', why: n < 0 ? 'Deadline passed ' + (-n) + ' days ago' : (n === 0 ? 'Deadline is today' : 'Deadline in ' + n + ' days') });
      else if (n <= 7) out.push({ id: 'E07', why: 'Deadline in ' + n + ' days' });
    }
    if (it.workaround === 'No') out.push({ id: 'E13', why: 'No workaround available' });
    if (it.lastUpdate) { n = bizSince(it.lastUpdate); if (n > 5) out.push({ id: 'E15', why: 'No update for ' + n + ' business days' }); }
    return out;
  }
  function updateStatus(it, final) {
    if (isClosed(it)) return { key: 'closed', label: 'Closed' };
    if (!it.lastUpdate) return { key: 'none', label: 'No update logged' };
    var biz = bizSince(it.lastUpdate);
    if (biz > 5) return { key: 'stale', label: 'Stale (E15)' };
    var p = priObj(final); if (!p) return { key: 'ok', label: 'On cadence' };
    var r = p.cadenceRule || { unit: 'calendar', maxDays: 7 };
    var n = r.unit === 'business' ? biz : calSince(it.lastUpdate);
    return n > r.maxDays ? { key: 'overdue', label: 'Overdue' } : { key: 'ok', label: 'On cadence' };
  }
  function evaluate(it) {
    var closed = isClosed(it);
    var final = higher(it.basePriority, it.overridePriority);
    var auto = autoClauses(it);
    var ids = it.clauses.slice(); auto.forEach(function (a) { if (ids.indexOf(a.id) < 0) ids.push(a.id); });
    var sugg = it.basePriority, driver = null;
    if (rank(it.basePriority) != null) {
      ids.forEach(function (id) { var c = clauseById(id); if (!c) return; var s = applyClause(it.basePriority, c.logic); if (rank(s) < rank(sugg)) { sugg = s; driver = id; } });
    }
    var below = !closed && rank(sugg) != null && rank(final) != null && rank(sugg) < rank(final);
    var dl = it.deadline ? calUntil(it.deadline) : null;
    return { closed: closed, final: final, auto: auto, ids: ids, sugg: sugg, driver: driver, below: below,
      upd: updateStatus(it, final), triage: !closed && !final,
      noPlan: !closed && (!it.zenotiOwner || !it.nextAction || !it.nextActionDue),
      deadlineSoon: !closed && dl != null && dl <= 7 };
  }

  /* ---------- chrome (banners, header) ---------- */
  function renderChrome() {
    var pill = $('dirtyPill');
    pill.hidden = !state.dirty; pill.textContent = state.dirty;
    var st = state.data.meta.exportedAt ? new Date(state.data.meta.exportedAt) : null;
    $('dataStamp').textContent = (state.source === 'file' ? 'issues.js' : 'starter data') + (st ? ' · last saved ' + st.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '');
    var b = [];
    if (state.notice === 'conflict') {
      b.push('<div class="banner danger"><p><strong>The issues.js in this folder is newer than your unsaved browser changes.</strong> Someone may have committed an update. Keep your browser copy (and save it, then merge by hand), or load the file and lose the browser changes.</p>' +
        '<button class="btn small" data-act="keepLocal" type="button">Keep my browser copy</button><button class="btn small" data-act="loadFile" type="button">Load the file</button></div>');
    }
    if (state.source === 'seed') {
      b.push('<div class="banner info"><p><strong>issues.js was not found next to this page,</strong> so the starter data built into the page is shown. Use <em>Save data file</em> and put the downloaded issues.js beside index.html.</p></div>');
    }
    if (state.notice === 'newer' && !state.dirty) {
      b.push('<div class="banner info"><p>This browser holds a newer copy than the issues.js here (you saved a file that has not been uploaded yet). Upload your latest issues.js to the repository.</p><button class="btn small" data-act="dismiss" type="button">Dismiss</button></div>');
    }
    if (state.dirty) {
      b.push('<div class="banner warn"><p><strong>' + state.dirty + ' change' + (state.dirty === 1 ? '' : 's') + ' saved in this browser only.</strong> Click <em>Save data file</em>, then replace issues.js in your GitHub repository and commit, so the changes are kept and shared.</p><button class="btn small" data-act="save" type="button">Save data file</button></div>');
    }
    if (!storageOk) {
      b.push('<div class="banner danger"><p>Browser storage is unavailable here, so changes disappear on reload. Save the data file before closing the page.</p></div>');
    }
    $('banners').innerHTML = b.join('');
  }
  $('banners').addEventListener('click', function (e) {
    var a = e.target.getAttribute('data-act'); if (!a) return;
    if (a === 'save') saveFile();
    if (a === 'dismiss') { state.notice = null; renderChrome(); }
    if (a === 'keepLocal') { state.baseStamp = state.conflictFile.meta.exportedAt; state.notice = null; persist(); renderChrome(); toast('Keeping the browser copy. Save the data file when ready.'); }
    if (a === 'loadFile') { useBase(state.conflictFile, state.conflictFile.meta.exportedAt); state.notice = null; persist(); renderAll(); toast('Loaded issues.js.'); }
  });

  /* ---------- metrics ---------- */
  var FLAGS = [
    ['', 'Any flag'], ['overdue', 'Update overdue'], ['stale', 'Stale (E15)'], ['none', 'No update logged'],
    ['below', 'Below rule suggestion'], ['noPlan', 'Missing owner / plan'], ['triage', 'Needs triage'], ['deadline', 'Deadline ≤ 7 days']
  ];
  function flagMatch(flag, ev) {
    switch (flag) {
      case 'overdue': return ev.upd.key === 'overdue';
      case 'stale': return ev.upd.key === 'stale';
      case 'none': return ev.upd.key === 'none';
      case 'below': return ev.below;
      case 'noPlan': return ev.noPlan;
      case 'triage': return ev.triage;
      case 'deadline': return ev.deadlineSoon;
      default: return true;
    }
  }
  function renderMetrics() {
    var open = state.data.issues.filter(function (i) { return !isClosed(i); });
    var evs = open.map(evaluate);
    var count = function (f) { return evs.filter(function (e) { return flagMatch(f, e); }).length; };
    var byP = {}; priNames().forEach(function (n) { byP[n] = 0; }); var nop = 0;
    evs.forEach(function (e) { if (e.final) byP[e.final]++; else nop++; });
    var daily = open.reduce(function (s, i) { return s + ((i.financialPeriod || 'per day') === 'per day' && i.financialImpact ? Number(i.financialImpact) : 0); }, 0);
    var total = open.length || 1;

    h += '<div class="tag-family"><div class="fam">Custom</div>' + custom.map(function (t) { return '<button type="button" class="chip-btn" data-tag="' + esc(t) + '" aria-pressed="true">' + esc(t) + ' ×</button>'; }).join('') +
      '<input class="inline-input" id="customTag" placeholder="Add tag + Enter" style="min-height:28px;padding:2px 8px;font-size:12px;width:150px" aria-label="Add a custom tag"></div>';
    var comp = draft.tags.map(function (t) { return known[t] && known[t].companions ? '<strong>' + esc(t) + '</strong>: ' + esc(known[t].companions) : ''; }).filter(Boolean);
    if (comp.length) h += '<div class="companions">Companion tags to check — ' + comp.join(' · ') + '</div>';
    $('tagPicker').innerHTML = h;
    $('customTag').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return; e.preventDefault();
      var v = this.value.trim().toUpperCase().replace(/\s+/g, '-'); if (v && draft.tags.indexOf(v) < 0) draft.tags.push(v);
      renderTagPicker(); $('customTag').focus();
    });
  }
  function renderClauses() {
    var auto = autoClauses(draft); var autoMap = {}; auto.forEach(function (a) { autoMap[a.id] = a.why; });
    $('clauseGrid').innerHTML = cfg().clauses.map(function (c) {
      var isAuto = !!autoMap[c.id] && draft.clauses.indexOf(c.id) < 0;
      var checked = draft.clauses.indexOf(c.id) >= 0 || isAuto;
      return '<label class="clause-opt" title="' + esc(c.condition) + '"><input type="checkbox" data-clause="' + esc(c.id) + '"' + (checked ? ' checked' : '') + (isAuto ? ' disabled' : '') + '><span><strong class="mono">' + esc(c.id) + '</strong> ' + esc(c.trigger) +
        '<span class="eff">' + esc(c.effect) + '</span>' + (autoMap[c.id] ? '<span class="autow">Automatic: ' + esc(autoMap[c.id]) + '</span>' : '') + '</span></label>';
    }).join('');
  }
  function renderVerdict() {
    var ev = evaluate(draft); var el = $('verdict');
    var badge = function (p) { return p ? '<span class="pri pri-' + esc(p) + '">' + esc(p) + '</span>' : '<span class="pri pri-none">Not set</span>'; };
    var expl = ev.driver ? 'Strongest clause: <span class="mono">' + esc(ev.driver) + '</span> — ' + esc(clauseById(ev.driver).effect) : (ev.ids.length ? 'Selected clauses do not raise the base priority.' : 'No clauses selected.');
    var h = '<div class="verdict' + (ev.below ? ' warn' : '') + '">' +
      '<div class="row"><strong>Final priority</strong> ' + badge(ev.final) + '<span class="muted">Rule suggestion</span> ' + badge(ev.sugg) + '</div>' +
      '<div class="muted" style="font-size:12.5px">' + expl + '</div>';
    if (ev.below) h += '<div class="row"><span>The rules suggest <strong>' + esc(ev.sugg) + '</strong>, above the final priority.</span><button class="btn small" type="button" id="btnApplySugg">Set override to ' + esc(ev.sugg) + '</button></div>';
    var p = priObj(ev.final);
    if (p) h += '<div class="muted" style="font-size:12.5px">' + esc(p.name) + ': acknowledge ' + esc(p.ack) + ' · action plan ' + esc(p.plan) + ' · updates ' + esc(p.cadence) + ' · escalate to ' + esc(p.owner) + '</div>';
    el.innerHTML = h + '</div>';
    var b = $('btnApplySugg'); if (b) b.addEventListener('click', function () { draft.overridePriority = ev.sugg; $('f_overridePriority').value = ev.sugg; renderVerdict(); renderDyn(); });
    var bp = $('h_basePriority'); if (bp) { var po = priObj(draft.basePriority); bp.textContent = po ? po.entry : 'Use the Priority Framework entry criteria, before clauses.'; }
  }
  function renderDyn() {
    var c = $('dyn_cadence'); if (c) { var p = priObj(higher(draft.basePriority, draft.overridePriority)); c.textContent = 'Leave blank to use the default' + (p ? ' (' + p.cadence + ')' : ''); }
    var w = $('dyn_closeWarn');
    if (w) {
      var missing = [];
      if (isClosed(draft)) {
        if (!draft.closureNotes) missing.push('validation notes');
        if (draft.rcaRequired !== 'No' && !draft.preventionOwner) missing.push('recurrence-prevention owner');
      }
      w.style.color = missing.length ? 'var(--warn)' : '';
      w.textContent = missing.length ? 'Closing without ' + missing.join(' and ') + '. The operating model asks for validation evidence, RCA and a prevention owner before closing.' : 'Outcome validated, data and money reconciled, no recurrence.';
    }
  }
  function renderLog() {
    var items = draft.log.slice().map(function (l, i) { return { l: l, i: i }; }).sort(function (a, b) { return a.l.at < b.l.at ? 1 : a.l.at > b.l.at ? -1 : b.i - a.i; });
    $('logList').innerHTML = items.length ? items.map(function (x) { return '<li><span class="d">' + esc(fmtDate(x.l.at) || x.l.at) + '</span><span class="k ' + (x.l.type === 'note' ? 'note' : '') + '">' + (x.l.type === 'note' ? 'Update' : 'Change') + '</span><span>' + esc(x.l.text) + '</span></li>'; }).join('') : '<li class="muted">No activity yet.</li>';
  }

  $('form').addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-k'); if (!k) return;
    var v = e.target.value;
    if (k === 'financialImpact') v = v === '' ? null : Number(v);
    draft[k] = v;
    var w = $('w_' + k); if (w && w.classList.contains('invalid') && String(v || '').trim()) { w.classList.remove('invalid'); w.querySelector('.err').hidden = true; }
    if (['basePriority', 'overridePriority', 'deadline', 'workaround', 'lastUpdate', 'lastAgentResponse', 'status'].indexOf(k) >= 0) { renderClauses(); renderVerdict(); }
    if (!document.querySelector('.field.invalid')) $('formMsg').textContent = '';
    if (k === 'id') $('drawerTitle').textContent = (draft.id || 'New issue') + (draft.title ? ' · ' + draft.title : '');
    renderDyn();
  });
  $('form').addEventListener('change', function (e) {
    var c = e.target.getAttribute('data-clause'); if (!c) return;
    var i = draft.clauses.indexOf(c);
    if (e.target.checked && i < 0) draft.clauses.push(c); else if (!e.target.checked && i >= 0) draft.clauses.splice(i, 1);
    draft.clauses.sort(); renderVerdict();
  });
  $('form').addEventListener('click', function (e) {
    var t = e.target.closest('[data-tag]');
    if (t) {
      var tag = t.getAttribute('data-tag'); var i = draft.tags.indexOf(tag);
      if (i >= 0) draft.tags.splice(i, 1); else draft.tags.push(tag);
      renderTagPicker(); var again = $('tagPicker').querySelector('[data-tag="' + CSS.escape(tag) + '"]'); if (again) again.focus();
      return;
    }
    if (e.target.id === 'btnAddUpd') {
      var txt = $('updText').value.trim(), d = $('updDate').value || todayStr();
      if (!txt) { $('updText').focus(); return; }
      draft.log.push({ at: d, type: 'note', text: txt });
      if (!draft.lastUpdate || d > draft.lastUpdate) { draft.lastUpdate = d; var lu = $('f_lastUpdate'); if (lu) lu.value = d; }
      $('updText').value = ''; renderLog(); renderClauses(); renderVerdict();
    }
  });
  $('form').addEventListener('submit', function (e) { e.preventDefault(); });

  function openIssue(idx) {
    lastFocus = document.activeElement;
    editIdx = idx;
    draft = idx >= 0 ? clone(state.data.issues[idx]) : blankIssue();
    if (idx < 0) draft.log = [];
    $('drawerTitle').textContent = idx >= 0 ? draft.id + (draft.title ? ' · ' + draft.title : '') : 'New issue';
    $('drawerMeta').textContent = idx >= 0 ? 'Created ' + (fmtDate(draft.createdAt) || '—') + ' · last edited ' + (fmtDate(draft.updatedAt) || '—') : 'Intake: fields marked * are required.';
    $('btnDelete').hidden = idx < 0; deleteArmed = false; $('btnDelete').textContent = 'Delete';
    $('formMsg').textContent = '';
    renderForm();
    $('scrim').hidden = false; $('drawer').hidden = false;
    $('form').scrollTop = 0;
    setTimeout(function () { var f = $(idx >= 0 ? 'f_status' : 'f_id'); if (f) f.focus(); }, 30);
  }
  function closeDrawer() {
    $('scrim').hidden = true; $('drawer').hidden = true; draft = null; editIdx = -1;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $('btnClose').addEventListener('click', closeDrawer);
  $('btnCancel').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!$('drawer').hidden) closeDrawer(); else if ($('moreMenu').open) $('moreMenu').open = false; }
  });

  function validate() {
    var bad = [];
    document.querySelectorAll('.field.invalid').forEach(function (w) { w.classList.remove('invalid'); w.querySelector('.err').hidden = true; });
    var mark = function (k, msg) { var w = $('w_' + k); if (w) { w.classList.add('invalid'); var er = w.querySelector('.err'); er.textContent = msg; er.hidden = false; } bad.push(k); };
    var closed = isClosed(draft);
    REQUIRED.forEach(function (f) { if (!String(draft[f.k] == null ? '' : draft[f.k]).trim() && !(closed && f.k !== 'id' && f.k !== 'title' && f.k !== 'status')) mark(f.k, 'Required'); });
    if (!closed && !draft.basePriority && !draft.overridePriority) mark('basePriority', 'Required');
    var id = String(draft.id || '').trim();
    if (id && state.data.issues.some(function (it, i) { return i !== editIdx && it.id.toLowerCase() === id.toLowerCase(); })) mark('id', 'Another issue already uses this ID');
    return bad;
  }
  var TRACK = { status: 'Status', basePriority: 'Base priority', overridePriority: 'Override priority', zenotiOwner: 'Zenoti owner', deadline: 'Business deadline', nextActionDue: 'Next action due', requestType: 'Request type', function: 'Primary function' };
  $('btnSaveIssue').addEventListener('click', function () {
    draft.id = String(draft.id || '').trim(); draft.title = String(draft.title || '').trim();
    var bad = validate();
    if (bad.length) {
      $('formMsg').textContent = 'Fill in ' + bad.length + ' required field' + (bad.length > 1 ? 's' : '') + '.';
      var w = $('w_' + bad[0]); if (w) { w.scrollIntoView({ block: 'center', behavior: 'smooth' }); var c = w.querySelector('input,select,textarea'); if (c) c.focus(); }
      return;
    }
    if (draft.function && draft.tags.indexOf(draft.function) < 0) draft.tags.unshift(draft.function);
    var t = todayStr(); draft.updatedAt = t;
    if (editIdx >= 0) {
      var old = state.data.issues[editIdx];
      Object.keys(TRACK).forEach(function (k) { if ((old[k] || '') !== (draft[k] || '')) draft.log.push({ at: t, type: 'change', text: TRACK[k] + ': ' + (old[k] || '—') + ' → ' + (draft[k] || '—') }); });
      var of = higher(old.basePriority, old.overridePriority), nf = higher(draft.basePriority, draft.overridePriority);
      if (of !== nf) draft.log.push({ at: t, type: 'change', text: 'Final priority: ' + (of || '—') + ' → ' + (nf || '—') });
      if (old.clauses.join(';') !== draft.clauses.join(';')) draft.log.push({ at: t, type: 'change', text: 'Clauses: ' + (old.clauses.join(', ') || '—') + ' → ' + (draft.clauses.join(', ') || '—') });
      state.data.issues[editIdx] = draft;
      toast(draft.id + ' saved in this browser.');
    } else {
      draft.createdAt = t;
      draft.log.unshift({ at: t, type: 'change', text: 'Created through intake.' });
      state.data.issues.push(draft);
      toast(draft.id + ' added. Save the data file to keep it in the repository.');
    }
    closeDrawer(); markDirty(); renderFilters(); renderMetrics(); renderTable();
  });
  $('btnDelete').addEventListener('click', function () {
    if (!deleteArmed) { deleteArmed = true; this.textContent = 'Click again to delete'; var b = this; setTimeout(function () { deleteArmed = false; b.textContent = 'Delete'; }, 4000); return; }
    var id = state.data.issues[editIdx].id;
    state.data.issues.splice(editIdx, 1); closeDrawer(); markDirty(); renderFilters(); renderMetrics(); renderTable(); toast(id + ' deleted.');
  });
  $('btnNew').addEventListener('click', function () { setView('issues'); openIssue(-1); });

  /* ---------- files ---------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function saveFile() {
    var d = clone(state.data); d.meta.exportedAt = new Date().toISOString();
    var text = '// Zenoti Issue Tracker data file. Keep it next to index.html; replace it after "Save data file".\nwindow.ZENOTI_DATA = ' + JSON.stringify(d, null, 2) + ';\n';
    download('issues.js', text, 'text/javascript');
    state.data.meta.exportedAt = d.meta.exportedAt; state.baseStamp = d.meta.exportedAt; state.dirty = 0;
    if (state.notice === 'conflict') state.notice = null;
    persist(); renderChrome();
    toast('issues.js downloaded. Replace the file in your repository and commit.');
  }
  $('btnSave').addEventListener('click', saveFile);
  function csvCell(v) { v = v == null ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  $('btnCsv').addEventListener('click', function () {
    $('moreMenu').open = false;
    var head = ['Issue ID', 'Issue', 'Detected / reference period', 'Date detected', 'Status', 'Base priority', 'Override priority', 'Final priority', 'Rule suggestion', 'Request type', 'Primary function', 'Tags', 'Impact summary', 'Financial impact (MXN)', 'Financial period', 'Locations affected', 'Members affected', 'Workaround available', 'Business deadline', 'Last substantive update', 'Days since update', 'Update status', 'Escalation clauses', 'Automatic clauses', 'Zenoti owner', 'Next committed action', 'Next action due', 'Next governance review', 'Recommended next action', 'RCA required', 'Prevention owner', 'Evidence', 'Zenoti ticket', 'Reporter'];
    var rows = state.data.issues.map(function (it) {
      var ev = evaluate(it);
      return [it.id, it.title, it.period, it.detectedDate, it.status, it.basePriority, it.overridePriority, ev.final, ev.sugg, it.requestType, it.function, it.tags.join('; '), it.impactSummary, it.financialImpact, it.financialPeriod, it.locations, it.membersAffected, it.workaround, it.deadline, it.lastUpdate, it.lastUpdate ? calSince(it.lastUpdate) : '', ev.upd.label, it.clauses.join('; '), ev.auto.map(function (a) { return a.id; }).join('; '), it.zenotiOwner, it.nextAction, it.nextActionDue, it.nextReview, it.recommendedAction, it.rcaRequired, it.preventionOwner, it.evidence, it.zenotiTicket, it.reporter];
    });
    var csv = '﻿' + [head].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    download('zenoti-issues-' + todayStr() + '.csv', csv, 'text/csv;charset=utf-8');
  });
  $('btnImport').addEventListener('click', function () { $('moreMenu').open = false; $('fileInput').click(); });
  $('fileInput').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return; var input = this;
    var r = new FileReader();
    r.onload = function () {
      try {
        var txt = String(r.result).replace(/^﻿/, '').replace(/^\s*(\/\/[^\n]*\n\s*)*/, '').replace(/^window\.ZENOTI_DATA\s*=\s*/, '').replace(/;\s*$/, '');
        var d = JSON.parse(txt);
        if (!d || !Array.isArray(d.issues)) throw new Error('No "issues" list found');
        state.data = normalize(d); state.baseStamp = state.data.meta.exportedAt || ''; state.dirty = 1; state.notice = null;
        persist(); renderAll(); toast('Imported ' + state.data.issues.length + ' issues from ' + f.name + '.');
      } catch (err) { toast('Could not read ' + f.name + ': ' + err.message); }
      input.value = '';
    };
    r.readAsText(f);
  });
  $('btnDiscard').addEventListener('click', function () {
    $('moreMenu').open = false;
    if (!state.dirty) { toast('No browser changes to discard.'); return; }
    if (this.getAttribute('data-armed') !== '1') { this.setAttribute('data-armed', '1'); this.textContent = 'Click again to discard ' + state.dirty + ' change(s)'; $('moreMenu').open = true; var b = this; setTimeout(function () { b.removeAttribute('data-armed'); b.textContent = 'Discard browser changes'; }, 4000); return; }
    this.removeAttribute('data-armed'); this.textContent = 'Discard browser changes';
    var base = normalize(fileData || seed); useBase(base, base.meta.exportedAt || ''); state.notice = null; persist(); renderAll(); $('moreMenu').open = false;
    toast('Reloaded ' + (fileData ? 'issues.js' : 'the starter data') + '.');
  });
  document.addEventListener('click', function (e) { var m = $('moreMenu'); if (m.open && !m.contains(e.target)) m.open = false; });

  function renderAll() { renderChrome(); renderFilters(); renderMetrics(); renderTable(); if (state.view === 'ref') renderRef(); }
  load();
  renderAll();
})();
</script>
</body>
</html>
